<div class="modal fade" id="addTransactionModal" tabindex="-1" aria-labelledby="addTransactionModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="addTransactionModalLabel">Add New Transaction</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

   
      <form action="{% url 'add_transaction' %}" method="post">
        {% csrf_token %}
        {% comment %}    
          <div class="mb-3 row">
            <label for="{{ transaction_form.debit_account.id_for_label }}" class="col-sm-3 col-form-label">Debit Account (Wn):</label>
            <div class="col-sm-9">
              {{ transaction_form.debit_account }}
              <div id="debitAccountFunds" class="form-text mt-1"></div>
            </div>
          </div>
          <div class="mb-3 row">
            <label for="{{ transaction_form.credit_account.id_for_label }}" class="col-sm-3 col-form-label">Credit Account (Ma):</label>
            <div class="col-sm-9">
              {{ transaction_form.credit_account }}
            </div>
          </div> {% endcomment %}


        <div class="modal-body">
            {{ transaction_form.as_p }}
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="submit" class="btn btn-primary">Save Transaction</button>
        </div>
      </form>
    </div>
  </div>
</div>
