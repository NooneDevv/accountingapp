<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounting App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'accounting_app/css/style.css' %}">
</head>
<body>
    <header class="app-header bg-dark text-white p-3">
        <div class="container-fluid">
            <h1>Accounting App</h1>
        </div>
    </header>

    <div class="app-container d-flex">
        <aside class="app-sidebar d-flex flex-column flex-shrink-0 p-3 bg-light">
            {% include 'accounting_app/partials/_sidebar.html' %}
        </aside>

        <main class="app-main flex-grow-1 p-4">
            {% block content %}{% endblock %}
        </main>
    </div>

    <footer class="app-footer bg-light text-center p-3 mt-auto">
        <div class="container-fluid">
            <p class="mb-0">&copy; {% now "Y" %} Accounting App. All rights reserved.</p>
        </div>
    </footer>

    {% include 'accounting_app/partials/_add_transaction_modal.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'accounting_app/js/main.js' %}"></script>
</body>
</html>
