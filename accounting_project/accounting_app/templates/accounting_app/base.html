<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Księgowość</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'accounting_app/css/style.css' %}">
</head>
<body>
    <header class="app-header bg-dark text-white p-3">
        <div class="container-fluid">
            <h1>Aplikacja Księgowa</h1>
        </div>
    </header>
    
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="d-flex flex-column flex-shrink-0 p-3 bg-light" style="width: 280px; min-height: 100vh;">
            {% include 'accounting_app/partials/_sidebar.html' %}
        </div>

        <!-- Main Content -->
        <div class="flex-grow-1 p-4">
            {% block content %}{% endblock %}
        </div>
    </div>
    
    {% include 'accounting_app/partials/_add_transaction_modal.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'accounting_app/js/main.js' %}"></script>
</body>
</html>
